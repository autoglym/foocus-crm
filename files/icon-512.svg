<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#0a0a0b"/>
  <g transform="translate(256,270) scale(1.85)">
    <!-- Left owl eye -->
    <circle cx="-42" cy="0" r="42" fill="#e2e2e8" stroke="none"/>
    <circle cx="-42" cy="0" r="22" fill="#0a0a0b"/>
    <!-- Right owl eye -->
    <circle cx="42" cy="0" r="42" fill="#e2e2e8" stroke="none"/>
    <circle cx="42" cy="0" r="22" fill="#0a0a0b"/>
    <!-- Left ear -->
    <polygon points="-84,-20 -68,-55 -42,-20" fill="#e2e2e8"/>
    <!-- Right ear -->
    <polygon points="84,-20 68,-55 42,-20" fill="#e2e2e8"/>
